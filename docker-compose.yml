version: '3.8'

services:
  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0_qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - mem0_network

  # 可选: Ollama 本地 LLM 服务
  # 取消注释以使用
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: mem0_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   networks:
  #     - mem0_network

networks:
  mem0_network:
    driver: bridge

volumes:
  qdrant_storage:
  # ollama_data:

